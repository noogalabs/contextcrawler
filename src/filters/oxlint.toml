[filters.oxlint]
description = "Compact oxlint output — strip blank lines, keep diagnostics"
match_command = "^oxlint\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Finished in \\d+",
  # Only strip the all-clear summary ("Found 0 warnings and 0 errors").
  # A non-zero warning/error summary must survive so a warnings-only run is
  # not mistaken for a clean run.
  "^Found 0 warnings? and 0 errors?",
]
# tail_lines runs before max_lines (stages 6 then 7). Reserving the tail keeps
# oxlint's trailing summary line ("Found N warnings ...") and any trailing
# `error:` diagnostics from being head-truncated away on an overflowing run.
tail_lines = 49
max_lines = 50
# NOTE (#111/G8): on_empty must NOT assert success. oxlint can exit with no
# stdout on a hard crash (segfault, killed). Passing empty output through ("")
# lets the agent see the real empty result + exit code, not a false "ok".
on_empty = ""

[[tests.oxlint]]
name = "strips noise, keeps diagnostics and warning summary"
input = """
  × eslint(no-console): Unexpected console statement.
   ╭─[src/app.ts:5:3]
 5 │   console.log("debug");
   │   ^^^^^^^^^^^
   ╰────

  × eslint(no-unused-vars): 'x' is defined but never used.
   ╭─[src/utils.ts:2:7]
 2 │   let x = 42;
   │       ^
   ╰────

Found 2 warnings on 2 files.
Finished in 12ms on 100 files.
"""
expected = "  × eslint(no-console): Unexpected console statement.\n   ╭─[src/app.ts:5:3]\n 5 │   console.log(\"debug\");\n   │   ^^^^^^^^^^^\n   ╰────\n  × eslint(no-unused-vars): 'x' is defined but never used.\n   ╭─[src/utils.ts:2:7]\n 2 │   let x = 42;\n   │       ^\n   ╰────\nFound 2 warnings on 2 files."

[[tests.oxlint]]
name = "all-clear summary stripped to empty (crash not masked as ok)"
input = """
Found 0 warnings and 0 errors.
Finished in 5ms on 100 files.
"""
expected = ""

[[tests.oxlint]]
name = "clean output passes through as empty"
input = """
Finished in 5ms on 100 files.
"""
expected = ""

[[tests.oxlint]]
name = "empty input passes through (crash not masked as ok)"
input = ""
expected = ""

