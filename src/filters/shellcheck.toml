[filters.shellcheck]
description = "Compact shellcheck output — strip blank lines, keep caret indicators for error position"
match_command = "^shellcheck\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
# tail_lines runs before max_lines (stages 6 then 7). shellcheck has no summary
# line, but reserving the tail keeps the last findings visible instead of
# head-truncating to the first 50 on an overflowing run.
tail_lines = 49
max_lines = 50

[[tests.shellcheck]]
name = "multi-warning output stripped of blank lines only"
input = """
In script.sh line 3:
if [[ $1 == "" ]]
     ^-- SC2236: Use -z instead of ! -n.

In script.sh line 7:
echo $var
     ^-- SC2086: Double quote to prevent globbing.

"""
expected = "In script.sh line 3:\nif [[ $1 == \"\" ]]\n     ^-- SC2236: Use -z instead of ! -n.\nIn script.sh line 7:\necho $var\n     ^-- SC2086: Double quote to prevent globbing."

[[tests.shellcheck]]
name = "empty input passes through"
input = ""
expected = ""

