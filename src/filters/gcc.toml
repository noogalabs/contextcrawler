[filters.gcc]
description = "Compact gcc/g++ compiler output — strip notes, keep errors and warnings"
match_command = "^g(cc|\\+\\+)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s+\\|\\s*$",
  "^In file included from",
  "^\\s+from\\s",
  "^\\d+ warnings? generated",
  "^\\d+ errors? generated",
]
# tail_lines runs before max_lines (stages 6 then 7). Reserving the tail keeps
# the trailing `error:` lines and linker summary (e.g. "ld returned 1 exit
# status") from being head-truncated away on an overflowing run.
tail_lines = 49
max_lines = 50
# NOTE (#111/G8): on_empty must NOT assert success. gcc/g++ can exit with no
# stdout on a hard crash (internal compiler error killed, segfault). Passing
# empty output through ("") lets the agent see the real empty result + exit
# code, not a false "ok".
on_empty = ""

[[tests.gcc]]
name = "strips include chain, keeps errors and warnings"
input = """
In file included from /usr/include/stdio.h:42:
                 from main.c:1:
main.c:10:5: error: use of undeclared identifier 'foo'
    foo();
    ^
main.c:15:12: warning: unused variable 'x' [-Wunused-variable]
    int x = 42;
        ^
2 warnings generated.
1 error generated.
"""
expected = "main.c:10:5: error: use of undeclared identifier 'foo'\n    foo();\n    ^\nmain.c:15:12: warning: unused variable 'x' [-Wunused-variable]\n    int x = 42;\n        ^"

[[tests.gcc]]
name = "clean compilation passes through as empty"
input = """
"""
expected = ""

[[tests.gcc]]
name = "linker error kept"
input = """
/usr/bin/ld: /tmp/main.o: undefined reference to 'missing_func'
collect2: error: ld returned 1 exit status
"""
expected = "/usr/bin/ld: /tmp/main.o: undefined reference to 'missing_func'\ncollect2: error: ld returned 1 exit status"

[[tests.gcc]]
name = "empty input passes through (crash not masked as ok)"
input = ""
expected = ""

